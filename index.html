<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style/reset.css" />
    <link rel="stylesheet" href="./style/style.css" />
    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <img src="./asset/slide1.png" alt="slide" class="slide slide-left" />
      <img src="./asset/slide2.png" alt="slide" class="slide slide-right" />

      <div class="content-group">
        <img
          src="./asset/backgroundstill1.png"
          alt="backgroundstill1"
          class="backgroundstill1"
        />
        <img
          src="./asset/backgroundstill2.png"
          alt="backgroundstill2"
          class="backgroundstill2"
        />
        <img src="./asset/background.png" alt="background" class="background" />

        <img src="./asset/frame.png" alt="frame" class="frame" />
        <img src="./asset/frame2.png" alt="frame" class="frame2" />
        <div class="main-group">
          <img src="./asset/main.png" alt="main" class="main" />
          <div class="main-hitbox"></div>
          <img src="./asset/title.png" alt="title" class="title" />
          <img src="./asset/pen.png" alt="pen" class="pen" />
          <div class="small1-group">
            <img src="./asset/small1.png" alt="small" class="small2" />
            <div class="nothing-you-could-do-regular text1">
              He's the one. KILL HIM.
            </div>
          </div>
          <div class="small2-group">
            <img src="./asset/small2.png" alt="small" class="small1" />
            <div class="nothing-you-could-do-regular text2">
              Memories can be deceiving.
            </div>
          </div>
        </div>
      </div>
    </div>
